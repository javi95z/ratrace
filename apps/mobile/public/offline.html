<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#141b33" />
    <title>The Rat Race · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141b33; color: #f4f1e4; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; background: #141b33 radial-gradient(#1f2a4d 1px, transparent 1px) 0 0 / 6px 6px; }
      main { width: min(22rem, calc(100% - 2rem)); text-align: center; }
      img { width: 96px; height: 96px; image-rendering: pixelated; }
      h1 { color: #f2c14e; margin: 1rem 0 .5rem; }
      p { color: #c9cfdc; line-height: 1.45; }
      nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: 1.5rem; }
      a { min-height: 44px; display: grid; place-items: center; border: 2px solid #0b1022; background: #263566; color: #f4f1e4; text-decoration: none; font-weight: 700; box-shadow: 0 4px 0 #0b1022; }
      a:focus-visible { outline: 2px solid #f2c14e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>The Rat Race</h1>
      <p>You are offline. Open a language you have used before to keep playing.</p>
      <p>Sin conexión. Abre un idioma que ya hayas usado para seguir jugando.</p>
      <p>Нет сети. Открой язык, который уже использовался, чтобы продолжить.</p>
      <nav aria-label="Language / Idioma / Язык">
        <a href="/en" lang="en">English</a>
        <a href="/es" lang="es">Español</a>
        <a href="/ru" lang="ru">Русский</a>
      </nav>
    </main>
  </body>
</html>
